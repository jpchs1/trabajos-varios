name: Publicar CV en GitHub Pages

# El despliegue oficial via actions/deploy-pages quedo bloqueado por la
# regla de proteccion del entorno github-pages (solo rama principal).
# En su lugar, este workflow sincroniza el sitio a la rama gh-pages,
# que GitHub Pages sirve directamente.

on:
  push:
    branches: ["claude/cv-trabajador-social-uc-nu73rk"]
    paths:
      - "cv-trabajador-social-uc/site/**"
      - ".github/workflows/cv-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cv-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publicar sitio en gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd cv-trabajador-social-uc/site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy CV site ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
