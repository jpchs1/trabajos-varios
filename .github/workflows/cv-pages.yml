name: Publicar CV en GitHub Pages

on:
  push:
    branches: ["claude/cv-trabajador-social-uc-nu73rk"]
    paths:
      - "cv-trabajador-social-uc/site/**"
      - ".github/workflows/cv-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cv-trabajador-social-uc/site
      - id: deployment
        uses: actions/deploy-pages@v4
