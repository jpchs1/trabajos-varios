name: Deploy por FTP

# Sube las propuestas al hosting por FTP.
#
# Mientras no existan los secrets del repositorio, el workflow corre y se salta
# el deploy sin fallar. Apenas cargues FTP_HOST / FTP_USER / FTP_PASSWORD en
# Settings > Secrets and variables > Actions, empieza a publicar solo.

on:
  push:
    branches: [main]
    paths:
      - 'propuestas/**'
      - '.github/workflows/deploy-ftp.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular el deploy sin subir nada'
        type: boolean
        default: false

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credenciales
        id: check
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          faltan=""
          [ -n "$FTP_HOST" ]     || faltan="$faltan FTP_HOST"
          [ -n "$FTP_USER" ]     || faltan="$faltan FTP_USER"
          [ -n "$FTP_PASSWORD" ] || faltan="$faltan FTP_PASSWORD"
          if [ -n "$faltan" ]; then
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy omitido::Faltan secrets:$faltan. Cargalos en Settings > Secrets and variables > Actions."
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar lftp
        if: steps.check.outputs.listo == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Subir al hosting
        if: steps.check.outputs.listo == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ vars.FTP_REMOTE_DIR }}
          FTP_LOCAL_DIR: ${{ vars.FTP_LOCAL_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT }}
          FTP_USE_TLS: ${{ vars.FTP_USE_TLS }}
          FTP_DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/deploy-ftp.sh
