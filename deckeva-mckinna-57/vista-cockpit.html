<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Deckeva — Vista cockpit</title>
<style>
  html,body{margin:0;padding:0;background:#0F2C3C;}
  svg{display:block;}
  text{font-family:"Helvetica Neue",Helvetica,Arial,"DejaVu Sans",sans-serif;}
</style>
</head>
<body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A9CBE0"/><stop offset="1" stop-color="#E9F3F8"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#38688A"/><stop offset="1" stop-color="#6FA3BE"/>
  </linearGradient>
  <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#DFE2E0"/><stop offset="1" stop-color="#F6F7F5"/>
  </linearGradient>
  <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#DBDEDC"/><stop offset="1" stop-color="#F3F4F2"/>
  </linearGradient>
  <linearGradient id="transom" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F7F8F6"/><stop offset="1" stop-color="#DCDFDD"/>
  </linearGradient>
  <!-- tablones: más oscuros al fondo, más cálidos cerca -->
  <linearGradient id="pp1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#A87E4C"/><stop offset="1" stop-color="#CDA271"/>
  </linearGradient>
  <linearGradient id="pp2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9E7443"/><stop offset="1" stop-color="#C4975F"/>
  </linearGradient>
  <linearGradient id="pp3" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#B0854F"/><stop offset="1" stop-color="#D4AC7C"/>
  </linearGradient>
  <linearGradient id="margen" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#AE8350"/><stop offset="1" stop-color="#C79B65"/>
  </linearGradient>
  <radialGradient id="floorlight" cx="0.5" cy="0.75" r="0.7">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="ao" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#000000" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="hdr3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F2C3C"/><stop offset="1" stop-color="#164256"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF6DE" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#FFF6DE" stop-opacity="0"/>
  </radialGradient>
</defs>

<!-- ============ CIELO Y MAR ============ -->
<rect x="0" y="0" width="1600" height="352" fill="url(#sky)"/>
<circle cx="330" cy="120" r="150" fill="url(#sun)"/>
<g fill="#FFFFFF" opacity="0.5">
  <ellipse cx="1130" cy="120" rx="130" ry="18"/>
  <ellipse cx="1230" cy="100" rx="90" ry="14"/>
  <ellipse cx="420" cy="200" rx="110" ry="14"/>
</g>
<rect x="0" y="350" width="1600" height="260" fill="url(#sea)"/>
<line x1="0" y1="350" x2="1600" y2="350" stroke="#2C5876" stroke-width="2"/>
<g stroke="#DCEBF2" stroke-width="2" opacity="0.5">
  <line x1="180" y1="380" x2="260" y2="380"/><line x1="640" y1="368" x2="700" y2="368"/>
  <line x1="1220" y1="386" x2="1330" y2="386"/><line x1="420" y1="398" x2="470" y2="398"/>
  <line x1="1440" y1="368" x2="1500" y2="368"/>
</g>

<!-- ============ BARANDA POPA ============ -->
<g stroke="#B9C2C6" stroke-width="5" fill="none" stroke-linecap="round">
  <line x1="540" y1="368" x2="1060" y2="368"/>
  <line x1="540" y1="398" x2="1060" y2="398"/>
</g>
<g stroke="#A8B2B6" stroke-width="6" stroke-linecap="round">
  <line x1="560" y1="368" x2="558" y2="428"/>
  <line x1="800" y1="368" x2="800" y2="428"/>
  <line x1="1040" y1="368" x2="1042" y2="428"/>
</g>

<!-- ============ AMURADAS Y ESPEJO ============ -->
<!-- pared izquierda -->
<polygon points="500,432 0,602 0,943 500,560" fill="url(#wallL)"/>
<polygon points="500,424 0,586 0,606 500,436" fill="#FBFCFA"/>
<line x1="0" y1="604" x2="500" y2="434" stroke="#B9C2C6" stroke-width="2"/>
<!-- pared derecha -->
<polygon points="1100,432 1600,602 1600,943 1100,560" fill="url(#wallR)"/>
<polygon points="1100,424 1600,586 1600,606 1100,436" fill="#FBFCFA"/>
<line x1="1600" y1="604" x2="1100" y2="434" stroke="#B9C2C6" stroke-width="2"/>
<!-- espejo de popa -->
<rect x="500" y="432" width="600" height="128" fill="url(#transom)"/>
<rect x="496" y="420" width="608" height="16" rx="7" fill="#FBFCFA" stroke="#C3CBCE" stroke-width="1.5"/>
<!-- puerta de espejo -->
<rect x="940" y="444" width="104" height="116" rx="6" fill="#EEF0EE" stroke="#B9C2C6" stroke-width="2"/>
<circle cx="956" cy="506" r="5" fill="#98A2A6"/>
<!-- sombra de amurada sobre espejo -->
<rect x="500" y="432" width="600" height="10" fill="#000000" opacity="0.10"/>

<!-- ============ PISO DECKEVA ============ -->
<!-- base junta negra -->
<polygon points="500,560 1100,560 1517,880 83,880" fill="#15120D"/>
<!-- tablones -->
<polygon points="469.8,585 520.4,585 196.9,880 87.9,880" fill="url(#pp1)"/>
<polygon points="525.3,585 575.8,585 316.5,880 207.4,880" fill="url(#pp2)"/>
<polygon points="580.7,585 631.3,585 436.0,880 327.0,880" fill="url(#pp3)"/>
<polygon points="636.1,585 686.7,585 555.6,880 446.6,880" fill="url(#pp2)"/>
<polygon points="691.6,585 742.1,585 675.2,880 566.1,880" fill="url(#pp1)"/>
<polygon points="747.0,585 797.6,585 794.7,880 685.7,880" fill="url(#pp3)"/>
<polygon points="802.4,585 853.0,585 914.3,880 805.3,880" fill="url(#pp1)"/>
<polygon points="857.9,585 908.4,585 1033.9,880 924.8,880" fill="url(#pp2)"/>
<polygon points="913.3,585 963.9,585 1153.4,880 1044.4,880" fill="url(#pp3)"/>
<polygon points="968.7,585 1019.3,585 1273.0,880 1164.0,880" fill="url(#pp2)"/>
<polygon points="1024.2,585 1074.7,585 1392.6,880 1283.5,880" fill="url(#pp1)"/>
<polygon points="1079.6,585 1130.2,585 1512.1,880 1403.1,880" fill="url(#pp3)"/>
<!-- tabla de margen junto al espejo -->
<polygon points="500,560 1100,560 1132.6,585 467.4,585" fill="url(#margen)"/>
<line x1="500" y1="561" x2="1100" y2="561" stroke="#15120D" stroke-width="3"/>
<line x1="467.4" y1="585" x2="1132.6" y2="585" stroke="#15120D" stroke-width="4"/>
<!-- registro de sala de máquinas (línea ruteada) -->
<polygon points="597.8,640 1002.2,640 1106.5,800 493.5,800" fill="none" stroke="#15120D" stroke-width="3" opacity="0.55"/>
<!-- oclusión al fondo + luz -->
<polygon points="500,560 1100,560 1121.7,577 478.3,577" fill="url(#ao)" opacity="0.6"/>
<polygon points="500,560 1100,560 1517,880 83,880" fill="url(#floorlight)"/>

<!-- marca en el piso -->
<text x="800" y="862" font-size="17" letter-spacing="4" font-weight="700" fill="#15120D" opacity="0.5" text-anchor="middle">DECKEVA</text>

<!-- ============ BANDA INFERIOR ============ -->
<rect x="0" y="880" width="1600" height="120" fill="url(#hdr3)"/>
<text x="48" y="932" font-size="30" font-weight="700" letter-spacing="5" fill="#FFFFFF">DECK<tspan fill="#D9A96A">EVA</tspan></text>
<text x="48" y="962" font-size="13.5" letter-spacing="2" fill="#9FB9C6">PISOS DE GOMA EVA ANTIDESLIZANTES</text>
<text x="1552" y="928" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="end">Cockpit de popa — vista referencial</text>
<text x="1552" y="958" font-size="14.5" fill="#C9DAE3" text-anchor="end">McKinna 57 Pilothouse (1998) · teca café claro / línea negra · deckeva.cl</text>
</svg>
</body>
</html>
